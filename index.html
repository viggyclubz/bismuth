<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bismuth Learning</title>
   <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/style.css">
  <meta name="description" content="Bismuth Learning, where students learn chemistry- the easy way!">
    <meta name="keywords" content="chemistry, education, students, vetted, learning">
</head>
<body>
  <label for="password">This science review page is locked. Enter a password to enter:</label>
  <input type="password" id="password"><button id="submit">go!!</button>
  
 <script>
  const input = document.getElementById('password');
  const go = document.getElementById('submit');

  function tryUnlock() {
    if (input.value !== "imgaylol67") {
      alert("Wrong password");
      return;
    }

    const target = new URL('pages/lessons/lessons.html', window.location.href).href;
    const win = window.open('about:blank', '_blank');
    if (!win) {
      alert("Popup blocked. Allow popups for this page and try again.");
      return;
    }

    win.document.open();
    win.document.write(
      '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Bismuth Learning</title>' +
      '<style>html,body{margin:0;height:100%;background:#000}iframe{border:0;width:100%;height:100%}</style>' +
      '</head><body><iframe allowfullscreen src="' + target + '"></iframe></body></html>'
    );
    win.document.close();

    window.location.replace('https://forsyth.instructure.com');
  }

  go.addEventListener('click', tryUnlock);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
</script>
</body>
</html>
